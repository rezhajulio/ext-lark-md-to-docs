name: Build Extension

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Lint for Firefox
        run: npx web-ext lint --source-dir dist

      - name: Package extension
        run: |
          npm run package:firefox
          npm run package:xpi

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: md-to-lark-docs-packages
          path: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/*.xpi
          retention-days: 7

      - name: Upload dist folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-to-lark-docs-dist
          path: dist/
          retention-days: 7
